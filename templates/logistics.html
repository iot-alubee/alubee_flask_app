{% extends "index.html" %}

{% block content %}
<div class="app-content pt-3 p-md-3 p-lg-4">
	<div class="container-xl">
		<div class="app-card app-card-settings shadow-sm">
			<div class="app-card-body p-3 border-bottom">
				<form method="get" action="{{ url_for('logistics') }}" class="d-flex flex-wrap align-items-end gap-3">
					<div>
						<label for="logistics-date" class="form-label small mb-1">Date (IST)</label>
						<input id="logistics-date" type="date" name="date" class="form-control form-control-sm" value="{{ selected_date_iso }}">
					</div>
					<div>
						<label for="logistics-unit" class="form-label small mb-1">Unit</label>
						{% if unit_filter_locked %}
						<input type="hidden" name="unit" value="{{ selected_unit }}">
						<input
							id="logistics-unit"
							type="text"
							class="form-control form-control-sm bg-light"
							value="{% if selected_unit == 'unit-ii' %}Unit II{% else %}Unit I{% endif %}"
							readonly
							aria-readonly="true"
						>
						{% else %}
						<select id="logistics-unit" name="unit" class="form-select form-select-sm">
							<option value="unit-i" {% if selected_unit == 'unit-i' %}selected{% endif %}>Unit I</option>
							<option value="unit-ii" {% if selected_unit == 'unit-ii' %}selected{% endif %}>Unit II</option>
						</select>
						{% endif %}
					</div>
					<div class="d-flex gap-2 align-items-center ms-auto">
						<button type="submit" class="btn btn-sm btn-primary px-3">Refresh</button>
						<button type="button" class="btn btn-sm btn-outline-secondary px-3" id="logistics-refresh-today" title="Load today (IST)">Today</button>
					</div>
				</form>
			</div>
			<div class="app-card-body p-5 text-center text-muted">
				<p class="mb-0">Logistics dashboard coming soon.</p>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block page_scripts %}
<script>
(function () {
	var todayBtn = document.getElementById("logistics-refresh-today");
	if (!todayBtn) return;
	var todayUrl = {{ url_for('logistics', unit=selected_unit) | tojson }};
	todayBtn.addEventListener("click", function () {
		window.location.href = todayUrl;
	});
})();
</script>
{% endblock %}
